<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Music</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-bg-hover: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(22, 22, 24, 0.75);
      --accent-color: #fa233b; /* Apple Music Red */
      --accent-hover: #ff3b52;
      --text-main: #f5f5f7;
      --text-sub: #86868b;
      --border-color: rgba(255, 255, 255, 0.1);
      --blur-val: saturate(180%) blur(20px);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 150px;
      padding-top: env(safe-area-inset-top);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Apple-style Glass Header */
    header {
      padding: 16px 24px;
      background: var(--glass-bg);
      -webkit-backdrop-filter: var(--blur-val);
      backdrop-filter: var(--blur-val);
      border-bottom: 0.5px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-apple-primary {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 980px;
      padding: 7px 16px;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: -0.2px;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-apple-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-apple-primary:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    input[type="file"] {
      display: none;
    }

    /* Segmented Control (Apple Tabs) */
    .nav-segmented {
      display: flex;
      background-color: rgba(118, 118, 128, 0.24);
      padding: 2px;
      margin: 20px 24px;
      border-radius: 9px;
      gap: 2px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 12px;
      text-align: center;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      border-radius: 7px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: #636366;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    }

    .container-apple {
      padding: 0 24px;
      max-width: 800px;
      margin: 0 auto;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    /* Track List Item */
    .track-item, .playlist-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      margin-bottom: 8px;
      border: 0.5px solid var(--border-color);
      transition: background-color 0.2s ease;
    }

    .track-item:hover, .playlist-card:hover {
      background-color: var(--card-bg-hover);
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .track-icon-placeholder {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 14px;
      flex-shrink: 0;
    }

    .track-text {
      overflow: hidden;
    }

    .track-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 1px;
    }

    .track-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .icon-btn.active {
      color: var(--accent-color);
    }

    .playlist-details {
      display: none;
      background-color: rgba(0,0,0,0.15);
      border-top: 0.5px solid var(--border-color);
      padding: 8px 16px 8px 52px;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .playlist-details.active {
      display: block;
    }

    /* Apple-style Bottom Player Bar */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--glass-bg);
      -webkit-backdrop-filter: var(--blur-val);
      backdrop-filter: var(--blur-val);
      border-top: 0.5px solid var(--border-color);
      padding: 12px 24px calc(12px + env(safe-area-inset-bottom)) 24px;
      z-index: 100;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .time-text {
      font-size: 11px;
      color: var(--text-sub);
      width: 32px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .seek-slider {
      flex: 1;
      height: 3px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
      transition: height 0.15s ease;
    }

    .seek-slider:hover {
      height: 5px;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .now-playing {
      flex: 1;
      overflow: hidden;
      padding-right: 16px;
    }

    .np-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }

    .control-btns {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      color: var(--text-main);
      border: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .play-btn:active {
      transform: scale(0.9);
      opacity: 0.7;
    }

    .playlist-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .playlist-input {
      flex: 1;
      padding: 8px 16px;
      border-radius: 10px;
      border: 0.5px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .playlist-input:focus {
      border-color: var(--accent-color);
    }

    /* Modal Apple Style */
    .modal-content-apple {
      background-color: #1c1c1e;
      border-radius: 14px;
      border: 0.5px solid var(--border-color);
      padding: 20px;
      color: var(--text-main);
    }

    .modal-select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #2c2c2e;
      color: var(--text-main);
      border: 0.5px solid var(--border-color);
      margin-bottom: 20px;
      outline: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-music" style="color:var(--accent-color);"></i> ライブラリ</h1>
    <label class="btn-apple-primary" for="audioInput">
      <i class="fa-solid fa-plus"></i> 追加
    </label>
    <input type="file" id="audioInput" accept="audio/*, .mp3, .m4a, .wav" multiple>
  </header>

  <div class="container-apple">
    <div class="nav-segmented">
      <button class="tab-btn active" onclick="switchTab('tracks')">曲</button>
      <button class="tab-btn" onclick="switchTab('playlists')">プレイリスト</button>
    </div>

    <div id="section-tracks" class="section active">
      <div id="trackList"></div>
    </div>

    <div id="section-playlists" class="section">
      <div class="playlist-form">
        <input type="text" id="playlistNameInput" class="playlist-input" placeholder="新規プレイリスト名">
        <button class="btn-apple-primary" onclick="createPlaylist()">作成</button>
      </div>
      <div id="playlistList"></div>
    </div>
  </div>

  <div class="player-bar">
    <div class="progress-container">
      <span id="currentTime" class="time-text">0:00</span>
      <input type="range" id="seekSlider" class="seek-slider" min="0" value="0" step="0.1">
      <span id="durationTime" class="time-text">0:00</span>
    </div>
    <div class="controls">
      <div class="now-playing">
        <div id="npTitle" class="np-title">未選択</div>
      </div>
      <div class="control-btns">
        <button id="shuffleBtn" class="icon-btn" onclick="toggleShuffle()"><i class="fa-solid fa-shuffle"></i></button>
        <button class="icon-btn" onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
        <button id="playBtn" class="play-btn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
        <button class="icon-btn" onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
        <button id="repeatBtn" class="icon-btn" onclick="toggleRepeat()"><i class="fa-solid fa-repeat"></i></button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="playlistModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-content-apple">
        <h5 class="modal-title fw-semibold mb-3" style="font-size:16px;">プレイリストに追加</h5>
        <select id="playlistSelect" class="modal-select"></select>
        <div class="d-flex justify-content-end gap-3">
          <button type="button" class="btn btn-link text-decoration-none text-secondary btn-sm p-0" data-bs-dismiss="modal">キャンセル</button>
          <button type="button" class="btn-apple-primary" onclick="confirmAddToPlaylist()">追加</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="audioEngine"></audio>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'app-cache-v3';
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            fetch(e.request).then(res => {
              const clone = res.clone();
              caches.open(CACHE_NAME).then(c => c.put(e.request, clone));
              return res;
            }).catch(() => caches.match(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // DB Setup
    let db;
    const dbReq = indexedDB.open("LocalMusicPlayerDB", 1);
    dbReq.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
      if (!db.objectStoreNames.contains("playlists")) db.createObjectStore("playlists", { keyPath: "id", autoIncrement: true });
    };
    dbReq.onsuccess = (e) => {
      db = e.target.result;
      loadTracks();
      loadPlaylists();
    };

    // State
    let allTracks = [];
    let currentQueue = [];
    let currentTrackIndex = -1;
    let selectedTrackIdForModal = null;
    let isShuffle = false;
    let repeatMode = 0; // 0: OFF, 1: ALL, 2: ONE

    const audio = document.getElementById("audioEngine");
    const playBtn = document.getElementById("playBtn");
    const seekSlider = document.getElementById("seekSlider");
    const currentTimeEl = document.getElementById("currentTime");
    const durationTimeEl = document.getElementById("durationTime");
    const npTitle = document.getElementById("npTitle");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const repeatBtn = document.getElementById("repeatBtn");
    const bsModal = new bootstrap.Modal(document.getElementById('playlistModal'));

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      if (tab === 'tracks') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('section-tracks').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('section-playlists').classList.add('active');
      }
    }

    // Tracks
    document.getElementById("audioInput").addEventListener("change", (e) => {
      const files = e.target.files;
      if (!files.length) return;
      const tx = db.transaction("tracks", "readwrite");
      const store = tx.objectStore("tracks");
      for (let file of files) {
        store.add({ name: file.name.replace(/\.[^/.]+$/, ""), type: file.type, data: file });
      }
      tx.oncomplete = () => { loadTracks(); e.target.value = ""; };
    });

    function loadTracks() {
      const tx = db.transaction("tracks", "readonly");
      tx.objectStore("tracks").getAll().onsuccess = (e) => {
        allTracks = e.target.result;
        renderTrackList(allTracks);
        loadPlaylists();
      };
    }

    function renderTrackList(tracks) {
      const listEl = document.getElementById("trackList");
      listEl.innerHTML = "";
      if (tracks.length === 0) {
        listEl.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:60px 0; font-size:14px;">曲がありません</div>';
        return;
      }
      tracks.forEach((track) => {
        const div = document.createElement("div");
        div.className = "track-item";
        div.innerHTML = `
          <div class="item-header">
            <div class="track-info" onclick="playSingleFromAll(${track.id})">
              <div class="track-icon-placeholder"><i class="fa-solid fa-music"></i></div>
              <div class="track-text">
                <div class="track-title">${escapeHtml(track.name)}</div>
              </div>
            </div>
            <div class="track-actions">
              <button class="icon-btn" onclick="openAddToPlaylistModal(${track.id})"><i class="fa-solid fa-ellipsis"></i></button>
              <button class="icon-btn" onclick="deleteTrack(${track.id})"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    // Audio Control
    function playSingleFromAll(trackId) {
      currentQueue = isShuffle ? [...allTracks].sort(() => Math.random() - 0.5) : [...allTracks];
      currentTrackIndex = currentQueue.findIndex(t => Number(t.id) === Number(trackId));
      if (currentTrackIndex !== -1) playTrackByIndex(currentTrackIndex);
    }

    function playTrackByIndex(index) {
      if (index < 0 || index >= currentQueue.length) return;
      currentTrackIndex = index;
      const track = currentQueue[index];
      audio.src = URL.createObjectURL(track.data);
      audio.play();
      playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      npTitle.textContent = track.name;
    }

    function togglePlay() {
      if (!audio.src) {
        if (allTracks.length > 0) playSingleFromAll(allTracks[0].id);
        return;
      }
      if (audio.paused) { 
        audio.play(); 
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>'; 
      } else { 
        audio.pause(); 
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; 
      }
    }

    function prevTrack() {
      if (currentTrackIndex > 0) playTrackByIndex(currentTrackIndex - 1);
      else if (repeatMode === 1) playTrackByIndex(currentQueue.length - 1);
    }

    function nextTrack() {
      if (repeatMode === 2) {
        playTrackByIndex(currentTrackIndex);
      } else if (currentTrackIndex < currentQueue.length - 1) {
        playTrackByIndex(currentTrackIndex + 1);
      } else if (repeatMode === 1) {
        playTrackByIndex(0);
      }
    }

    audio.addEventListener("ended", () => nextTrack());

    function toggleShuffle() {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle("active", isShuffle);
      if (currentQueue.length > 0) {
        const currentTrack = currentQueue[currentTrackIndex];
        if (isShuffle) {
          currentQueue.sort(() => Math.random() - 0.5);
        } else {
          currentQueue = [...allTracks];
        }
        currentTrackIndex = currentQueue.findIndex(t => Number(t.id) === Number(currentTrack.id));
      }
    }

    function toggleRepeat() {
      repeatMode = (repeatMode + 1) % 3;
      if (repeatMode === 0) {
        repeatBtn.innerHTML = '<i class="fa-solid fa-repeat"></i>';
        repeatBtn.classList.remove("active");
      } else if (repeatMode === 1) {
        repeatBtn.innerHTML = '<i class="fa-solid fa-repeat"></i>';
        repeatBtn.classList.add("active");
      } else {
        repeatBtn.innerHTML = '<i class="fa-solid fa-repeat-1"></i>';
        repeatBtn.classList.add("active");
      }
    }

    audio.addEventListener("timeupdate", () => {
      if (!isNaN(audio.duration)) {
        seekSlider.max = audio.duration;
        seekSlider.value = audio.currentTime;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(audio.duration);
      }
    });

    seekSlider.addEventListener("input", () => audio.currentTime = seekSlider.value);

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function deleteTrack(id) {
      const numericId = Number(id);
      const tx = db.transaction(["tracks", "playlists"], "readwrite");
      tx.objectStore("tracks").delete(numericId);
      
      const plStore = tx.objectStore("playlists");
      plStore.getAll().onsuccess = (e) => {
        const playlists = e.target.result;
        playlists.forEach(pl => {
          if (pl.trackIds) {
            pl.trackIds = pl.trackIds.filter(tId => Number(tId) !== numericId);
            plStore.put(pl);
          }
        });
      };
      tx.oncomplete = () => loadTracks();
    }

    // Playlist
    function createPlaylist() {
      const input = document.getElementById("playlistNameInput");
      const name = input.value.trim();
      if (!name) return;
      const tx = db.transaction("playlists", "readwrite");
      tx.objectStore("playlists").add({ name: name, trackIds: [] });
      tx.oncomplete = () => { input.value = ""; loadPlaylists(); };
    }

    function loadPlaylists() {
      if (!db) return;
      const tx = db.transaction("playlists", "readonly");
      tx.objectStore("playlists").getAll().onsuccess = (e) => renderPlaylists(e.target.result);
    }

    function renderPlaylists(playlists) {
      const container = document.getElementById("playlistList");
      container.innerHTML = "";
      if (playlists.length === 0) {
        container.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:60px 0; font-size:14px;">プレイリストがありません</div>';
        return;
      }

      playlists.forEach(pl => {
        const div = document.createElement("div");
        div.className = "playlist-card";
        
        const plTrackIds = (pl.trackIds || []).map(id => Number(id));
        const plTracks = allTracks.filter(t => plTrackIds.includes(Number(t.id)));

        let innerTracksHtml = plTracks.length === 0 ? 
          '<div style="color:var(--text-sub); font-size:12px; padding:10px 0;">曲が含まれていません</div>' :
          plTracks.map(t => `
            <div class="item-header" style="padding:8px 0;">
              <div class="track-info" onclick="playTrackFromPlaylist(${pl.id}, ${t.id})">
                <div class="track-title" style="font-size:13px;">${escapeHtml(t.name)}</div>
              </div>
              <button class="icon-btn" style="width:24px; height:24px; font-size:11px;" onclick="removeFromPlaylist(${pl.id}, ${t.id})"><i class="fa-solid fa-xmark"></i></button>
            </div>
          `).join('');

        div.innerHTML = `
          <div class="item-header">
            <div class="track-info" onclick="togglePlaylistDetails(${pl.id})">
              <div class="track-icon-placeholder"><i class="fa-solid fa-list"></i></div>
              <div class="track-text">
                <div class="track-title">${escapeHtml(pl.name)}</div>
                <div class="track-sub">${plTracks.length} 曲</div>
              </div>
            </div>
            <div class="track-actions">
              <button class="icon-btn active" onclick="playEntirePlaylist(${pl.id})"><i class="fa-solid fa-play"></i></button>
              <button class="icon-btn" onclick="deletePlaylist(${pl.id})"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
          <div id="pl-details-${pl.id}" class="playlist-details">
            ${innerTracksHtml}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function togglePlaylistDetails(plId) {
      const el = document.getElementById(`pl-details-${plId}`);
      if (el) el.classList.toggle("active");
    }

    function playEntirePlaylist(plId) {
      const tx = db.transaction("playlists", "readonly");
      tx.objectStore("playlists").get(Number(plId)).onsuccess = (e) => {
        const pl = e.target.result;
        const plTrackIds = (pl.trackIds || []).map(id => Number(id));
        const targetTracks = allTracks.filter(t => plTrackIds.includes(Number(t.id)));
        if (targetTracks.length > 0) {
          currentQueue = isShuffle ? [...targetTracks].sort(() => Math.random() - 0.5) : [...targetTracks];
          playTrackByIndex(0);
        }
      };
    }

    function playTrackFromPlaylist(plId, trackId) {
      const tx = db.transaction("playlists", "readonly");
      tx.objectStore("playlists").get(Number(plId)).onsuccess = (e) => {
        const pl = e.target.result;
        const plTrackIds = (pl.trackIds || []).map(id => Number(id));
        const targetTracks = allTracks.filter(t => plTrackIds.includes(Number(t.id)));
        currentQueue = isShuffle ? [...targetTracks].sort(() => Math.random() - 0.5) : [...targetTracks];
        currentTrackIndex = currentQueue.findIndex(t => Number(t.id) === Number(trackId));
        if (currentTrackIndex !== -1) playTrackByIndex(currentTrackIndex);
      };
    }

    function removeFromPlaylist(plId, trackId) {
      const tx = db.transaction("playlists", "readwrite");
      const store = tx.objectStore("playlists");
      store.get(Number(plId)).onsuccess = (e) => {
        const pl = e.target.result;
        pl.trackIds = (pl.trackIds || []).filter(id => Number(id) !== Number(trackId));
        store.put(pl);
      };
      tx.oncomplete = () => loadPlaylists();
    }

    function deletePlaylist(id) {
      const tx = db.transaction("playlists", "readwrite");
      tx.objectStore("playlists").delete(Number(id));
      tx.oncomplete = () => loadPlaylists();
    }

    // Modal Operations
    function openAddToPlaylistModal(trackId) {
      selectedTrackIdForModal = Number(trackId);
      const tx = db.transaction("playlists", "readonly");
      tx.objectStore("playlists").getAll().onsuccess = (e) => {
        const playlists = e.target.result;
        const select = document.getElementById("playlistSelect");
        select.innerHTML = "";
        if (playlists.length === 0) {
          alert("先にプレイリストを作成してください");
          return;
        }
        playlists.forEach(pl => {
          const opt = document.createElement("option");
          opt.value = pl.id;
          opt.textContent = pl.name;
          select.appendChild(opt);
        });
        bsModal.show();
      };
    }

    function confirmAddToPlaylist() {
      const plId = Number(document.getElementById("playlistSelect").value);
      if (!plId || !selectedTrackIdForModal) return;

      const tx = db.transaction("playlists", "readwrite");
      const store = tx.objectStore("playlists");
      store.get(plId).onsuccess = (e) => {
        const pl = e.target.result;
        if (!pl.trackIds) pl.trackIds = [];
        const trackIdNum = Number(selectedTrackIdForModal);
        
        if (!pl.trackIds.map(id => Number(id)).includes(trackIdNum)) {
          pl.trackIds.push(trackIdNum);
          store.put(pl);
        }
      };
      tx.oncomplete = () => {
        bsModal.hide();
        loadPlaylists();
      };
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
  </script>
</body>
