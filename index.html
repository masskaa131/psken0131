<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apple Music Like PWA Player</title>

<!-- MP3/音声メタデータ解析ライブラリ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<!-- PWA & Web App Settings -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<!-- External CSS Libraries -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
:root {
  --bg-black: #000000;
  --bg-glass: rgba(25, 25, 25, 0.78);
  --card-glass: rgba(38, 38, 42, 0.65);
  --card-glass-hover: rgba(55, 55, 60, 0.8);
  --accent-color: #fa233b;
  --text-main: #ffffff;
  --text-sub: #a1a1a6;
  --border-glass: rgba(255, 255, 255, 0.12);
  --modal-glass: rgba(30, 30, 32, 0.88);
  --player-bg: rgba(18, 18, 20, 0.92);
  --ambient-color-1: #1e1e24;
  --ambient-color-2: #0a0a0c;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-black);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  margin: 0;
  padding: 0;
  padding-bottom: 140px;
  user-select: none;
  -webkit-user-select: none;
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top, 20px);
}

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

.glass-header {
  background: var(--bg-glass);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-bottom: 1px solid var(--border-glass);
}

.glass-card {
  background: var(--card-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-glass);
  border-radius: 16px;
  padding: 16px;
  transition: all 0.2s ease;
}

.glass-modal {
  background: var(--modal-glass) !important;
  backdrop-filter: blur(30px) !important;
  -webkit-backdrop-filter: blur(30px) !important;
  border: 1px solid var(--border-glass) !important;
  color: var(--text-main);
  border-radius: 20px;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.app-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.nav-tabs-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 16px;
  scrollbar-width: none;
}
.nav-tabs-scroll::-webkit-scrollbar { display: none; }

.nav-tab-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--border-glass);
  color: var(--text-sub);
  font-size: 14px;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 20px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}

.nav-tab-btn.active {
  background: var(--accent-color);
  color: #fff;
  border-color: var(--accent-color);
}

.search-bar input {
  color: #ffffff !important;
  background-color: rgba(255, 255, 255, 0.12);
  border: 1px solid var(--border-glass);
  border-radius: 10px;
}

.batch-toolbar {
  display: none;
  background: rgba(250, 35, 59, 0.15);
  border: 1px solid var(--accent-color);
  border-radius: 14px;
  padding: 12px 18px;
  margin-bottom: 16px;
  align-items: center;
  justify-content: space-between;
}
.batch-toolbar.active { display: flex; }

.song-list { list-style: none; padding: 0; margin: 0; }

.song-item {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  border-radius: 12px;
  margin-bottom: 6px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid transparent;
  transition: background 0.2s;
}
.song-item:hover { background: rgba(255, 255, 255, 0.07); }
.song-item.active {
  background: rgba(250, 35, 59, 0.18);
  border-color: rgba(250, 35, 59, 0.4);
}

.song-checkbox {
  width: 20px;
  height: 20px;
  margin-right: 12px;
  accent-color: var(--accent-color);
}

.song-cover {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  background: #2c2c2e;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  margin-right: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.song-cover img { width: 100%; height: 100%; object-fit: cover; }

.song-details { flex: 1; overflow: hidden; cursor: pointer; }
.song-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-meta { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }

.song-actions { display: flex; align-items: center; gap: 4px; }
.btn-action-icon {
  background: none;
  border: none;
  color: var(--text-sub);
  font-size: 15px;
  padding: 6px 8px;
  border-radius: 50%;
  cursor: pointer;
  transition: color 0.2s;
}
.btn-action-icon:hover { color: #fff; }
.btn-action-icon.active { color: var(--accent-color); }

.grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 14px;
}

.grid-card {
  background: var(--card-glass);
  border: 1px solid var(--border-glass);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s;
}
.grid-card:hover { transform: translateY(-3px); }
.grid-cover {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 10px;
  background: #252528;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: var(--accent-color);
  margin-bottom: 8px;
  overflow: hidden;
}
.grid-cover img { width: 100%; height: 100%; object-fit: cover; }
.grid-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid-sub { font-size: 12px; color: var(--text-sub); }

.drop-zone {
  border: 2px dashed var(--border-glass);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  background: rgba(255, 255, 255, 0.02);
  cursor: pointer;
}

/* Player Bar */
.player-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 80px;
  background: var(--player-bg);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-top: 1px solid var(--border-glass);
  display: flex;
  align-items: center;
  padding: 0 16px;
  z-index: 200;
}

.mini-progress-container {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: rgba(255, 255, 255, 0.1);
  cursor: pointer;
}
.mini-progress-bar { height: 100%; background: var(--accent-color); width: 0%; }

.player-mini-info { display: flex; align-items: center; flex: 1; overflow: hidden; cursor: pointer; }
.player-mini-cover { width: 48px; height: 48px; border-radius: 8px; background: #2c2c2e; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; overflow: hidden; }
.player-mini-cover img { width: 100%; height: 100%; object-fit: cover; }

.player-controls { display: flex; align-items: center; gap: 8px; }
.player-controls button { background: none; border: none; color: var(--text-sub); font-size: 18px; cursor: pointer; padding: 6px; }
.player-controls button.active { color: var(--accent-color); }
.player-controls button.btn-play { font-size: 24px; color: #fff; }

/* Dynamic Ambient Fullscreen Player */
.full-player-modal {
  position: fixed;
  top: 100%; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle at 50% 30%, var(--ambient-color-1) 0%, var(--ambient-color-2) 100%);
  transition: top 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
  z-index: 300;
  display: flex;
  flex-direction: column;
  padding: 20px 24px;
  overflow-y: auto;
}
.full-player-modal.active { top: 0; }

.full-player-header { display: flex; justify-content: space-between; align-items: center; }

.full-player-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin: 10px 0;
  position: relative;
  width: 100%;
}

.full-player-cover-container {
  width: 100%;
  max-width: 300px;
  aspect-ratio: 1;
  border-radius: 16px;
  background: #2c2c2e;
  overflow: hidden;
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.3s ease;
}
.full-player-cover-container img { width: 100%; height: 100%; object-fit: cover; }

/* Lyrics Overlay Container */
.lyrics-container {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(15px);
  border-radius: 16px;
  padding: 20px;
  overflow-y: auto;
  display: none;
  flex-direction: column;
  align-items: center;
  mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
}
.lyrics-container.active { display: flex; }

.lyric-line {
  font-size: 18px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.4);
  margin: 12px 0;
  text-align: center;
  transition: all 0.3s ease;
  cursor: pointer;
}
.lyric-line.active {
  color: #ffffff;
  font-size: 22px;
  transform: scale(1.05);
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
}

.full-player-info { text-align: center; width: 100%; margin-top: 15px; }
.full-player-title { font-size: 20px; font-weight: 700; }
.full-player-artist { font-size: 14px; color: var(--text-sub); margin-top: 2px; }

.seek-slider-container { width: 100%; margin-top: 15px; }
.seek-slider {
  width: 100%;
  accent-color: var(--accent-color);
  height: 4px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 2px;
}
.time-stamps { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-top: 4px; }

.full-controls { display: flex; justify-content: space-around; align-items: center; width: 100%; margin: 15px 0; }
.full-controls button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
.full-controls button.btn-main-play { font-size: 46px; color: var(--accent-color); }

.extra-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 10px; margin-top: 5px; }
.extra-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 12px; }

.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(15px);
  z-index: 400;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}
.modal-overlay .modal-content {
  background: var(--modal-glass);
  border-top: 1px solid var(--border-glass);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 80vh;
  padding: 20px;
  overflow-y: auto;
}
</style>
</head>
<body>

<header class="app-header glass-header">
  <div class="app-title"><i class="fa-solid fa-music text-danger me-2"></i>ライブラリ</div>
  <div class="d-flex gap-2">
    <button class="btn btn-sm btn-outline-light rounded-pill" onclick="toggleBatchMode()">
      <i class="fa-solid fa-list-check me-1"></i>選択
    </button>
    <button class="btn btn-sm btn-outline-secondary rounded-circle" onclick="openSettingsModal()">
      <i class="fa-solid fa-gear"></i>
    </button>
  </div>
</header>

<div class="container mt-3">
  <!-- Dynamic Navigation Tabs -->
  <div class="nav-tabs-scroll">
    <button class="nav-tab-btn active" data-tab="songs" onclick="switchTab('songs')">すべての曲</button>
    <button class="nav-tab-btn" data-tab="artists" onclick="switchTab('artists')">アーティスト</button>
    <button class="nav-tab-btn" data-tab="albums" onclick="switchTab('albums')">アルバム</button>
    <button class="nav-tab-btn" data-tab="smart" onclick="switchTab('smart')">スマートリスト</button>
    <button class="nav-tab-btn" data-tab="playlists" onclick="switchTab('playlists')">プレイリスト</button>
  </div>

  <!-- TAB: ALL SONGS -->
  <div id="songsTabContent">
    <div class="glass-card mb-3 search-bar">
      <div class="row g-2">
        <div class="col-7">
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="曲名、歌手名で検索..." oninput="renderSongs()">
        </div>
        <div class="col-5">
          <select id="sortSelect" class="form-select form-select-sm bg-dark text-light border-secondary" onchange="renderSongs()">
            <option value="newest">追加順</option>
            <option value="title">曲名順</option>
            <option value="artist">歌手順</option>
            <option value="plays">再生回数順</option>
          </select>
        </div>
      </div>
    </div>

    <div id="batchToolbar" class="batch-toolbar">
      <div class="d-flex align-items-center">
        <input type="checkbox" id="selectAllCheckbox" class="song-checkbox" onchange="toggleSelectAll(this.checked)">
        <span id="selectedCountText" class="small fw-bold">0件選択中</span>
      </div>
      <div class="d-flex gap-2">
        <select id="batchPlaylistSelect" class="form-select form-select-sm bg-dark text-light border-secondary" style="width: 120px;"></select>
        <button class="btn btn-sm btn-danger" onclick="executeBatchAddToPlaylist()"><i class="fa-solid fa-plus"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick="executeBatchDelete()"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>

    <div class="glass-card mb-3">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <i class="fa-solid fa-cloud-arrow-up text-danger mb-2" style="font-size: 26px;"></i>
        <div class="fw-bold small">楽曲 / 歌詞 (LRC) ファイルの追加</div>
        <div class="text-muted" style="font-size: 11px;">ドラッグ＆ドロップまたはタップでファイルを選択</div>
        <input type="file" id="fileInput" accept="audio/*,.lrc" multiple style="display: none;" onchange="handleFileImport(this.files)">
      </div>
    </div>

    <ul id="songListContainer" class="song-list"></ul>
  </div>

  <!-- TAB: ARTISTS -->
  <div id="artistsTabContent" style="display: none;">
    <div id="artistsGrid" class="grid-container"></div>
  </div>

  <!-- TAB: ALBUMS -->
  <div id="albumsTabContent" style="display: none;">
    <div id="albumsGrid" class="grid-container"></div>
  </div>

  <!-- TAB: SMART PLAYLISTS -->
  <div id="smartTabContent" style="display: none;">
    <div class="grid-container">
      <div class="grid-card" onclick="openSmartList('fav')">
        <div class="grid-cover"><i class="fa-solid fa-heart text-danger"></i></div>
        <div class="grid-title">お気に入り</div>
        <div class="grid-sub" id="favCountSub">0曲</div>
      </div>
      <div class="grid-card" onclick="openSmartList('recent')">
        <div class="grid-cover"><i class="fa-solid fa-clock-rotate-left text-warning"></i></div>
        <div class="grid-title">最近追加した曲</div>
        <div class="grid-sub">直近30件</div>
      </div>
      <div class="grid-card" onclick="openSmartList('top25')">
        <div class="grid-cover"><i class="fa-solid fa-fire text-primary"></i></div>
        <div class="grid-title">よく聴く曲 Top 25</div>
        <div class="grid-sub">再生回数上位</div>
      </div>
    </div>
  </div>

  <!-- TAB: USER PLAYLISTS -->
  <div id="playlistsTabContent" style="display: none;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold m-0">マイプレイリスト</h6>
      <button class="btn btn-sm btn-danger rounded-pill" onclick="openCreatePlaylistModal()">
        <i class="fa-solid fa-plus me-1"></i>新規作成
      </button>
    </div>
    <div id="playlistGrid" class="grid-container"></div>
  </div>
</div>

<!-- Mini Player -->
<div class="player-bar">
  <div class="mini-progress-container" onclick="seekMiniPlayer(event)">
    <div class="mini-progress-bar" id="miniProgressBar"></div>
  </div>
  <div class="player-mini-info" onclick="openFullPlayer()">
    <div class="player-mini-cover" id="playerMiniCover">
      <i class="fa-solid fa-music text-secondary"></i>
    </div>
    <div class="player-mini-details">
      <div class="player-mini-title" id="playerMiniTitle">未再生</div>
      <div class="player-mini-artist" id="playerMiniArtist">楽曲を選択してください</div>
    </div>
  </div>
  <div class="player-controls">
    <button id="miniFavBtn" onclick="toggleFavoriteCurrent(event)"><i class="fa-regular fa-heart"></i></button>
    <button class="btn-play" onclick="togglePlay()"><i class="fa-solid fa-play" id="miniPlayBtnIcon"></i></button>
    <button onclick="playNext()"><i class="fa-solid fa-forward"></i></button>
  </div>
</div>

<!-- Fullscreen Ambient Player -->
<div id="fullPlayerModal" class="full-player-modal">
  <div class="full-player-header">
    <button class="btn-action-icon" onclick="closeFullPlayer()"><i class="fa-solid fa-chevron-down"></i></button>
    <span class="small text-white-50 fw-bold">再生中</span>
    <button class="btn-action-icon" id="lyricsToggleBtn" onclick="toggleLyrics()"><i class="fa-solid fa-quote-right"></i></button>
  </div>

  <div class="full-player-body">
    <div class="full-player-cover-container" id="fullPlayerCover">
      <i class="fa-solid fa-music text-secondary" style="font-size: 80px;"></i>
    </div>
    <div id="lyricsContainer" class="lyrics-container"></div>
  </div>

  <div class="full-player-info">
    <div class="full-player-title" id="fullPlayerTitle">未再生</div>
    <div class="full-player-artist" id="fullPlayerArtist">楽曲を選択してください</div>
  </div>

  <div class="seek-slider-container">
    <input type="range" id="fullSeekSlider" class="seek-slider" min="0" max="100" value="0" oninput="onSeekSliderChange(this.value)">
    <div class="time-stamps">
      <span id="currentTimeText">0:00</span>
      <span id="durationTimeText">0:00</span>
    </div>
  </div>

  <div class="full-controls">
    <button id="fullShuffleBtn" onclick="toggleShuffle()"><i class="fa-solid fa-shuffle"></i></button>
    <button onclick="playPrev()"><i class="fa-solid fa-backward"></i></button>
    <button class="btn-main-play" onclick="togglePlay()"><i class="fa-solid fa-circle-play" id="fullPlayBtnIcon"></i></button>
    <button onclick="playNext()"><i class="fa-solid fa-forward"></i></button>
    <button id="fullRepeatBtn" onclick="toggleRepeat()"><i class="fa-solid fa-repeat"></i></button>
  </div>

  <div class="extra-controls">
    <button class="extra-btn" id="speedBtn" onclick="cyclePlaybackRate()">1.0x</button>
    <button class="btn-action-icon" id="fullFavBtn" onclick="toggleFavoriteCurrent(event)"><i class="fa-regular fa-heart"></i></button>
    <button class="extra-btn" id="sleepTimerBtn" onclick="openSleepTimerMenu()"><i class="fa-solid fa-moon me-1"></i>タイマー</button>
    <button class="btn-action-icon" onclick="openCurrentPlaylistModal()"><i class="fa-solid fa-list-ul"></i></button>
  </div>
</div>

<audio id="audioPlayer" ontimeupdate="updateProgress()" onended="handleSongEnd()"></audio>

<!-- Canvas for Color Extraction -->
<canvas id="colorCanvas" style="display:none;"></canvas>

<!-- Modals -->
<div class="modal fade" id="createPlaylistModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-modal">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">新規プレイリスト</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="newPlaylistNameInput" class="form-control bg-dark text-light border-secondary" placeholder="プレイリスト名">
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-sm btn-danger rounded-pill" onclick="saveNewPlaylist()">作成</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="playlistDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content glass-modal">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="playlistDetailTitle">詳細</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <ul id="playlistSongListContainer" class="song-list"></ul>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-modal">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">設定 & PWA</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted">完全オフライン機能（Service Worker）: 有効</p>
        <button class="btn btn-sm btn-outline-danger w-100" onclick="clearAllData()">データを完全に初期化</button>
      </div>
    </div>
  </div>
</div>

  <div class="modal-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold m-0">再生中のリスト</h6>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ==========================================
1. Inline Service Worker (Offline Support)
========================================== */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE_NAME = 'music-pwa-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./'])));
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

/* ==========================================
2. IndexedDB & App State
========================================== */
const DB_NAME = 'AppleMusicPWADB_Full';
const DB_VERSION = 2;
let db;

let songsData = [];
let playlistsData = [];
let activeTab = 'songs';
let isBatchMode = false;
let selectedSongIds = new Set();

let currentPlayingIndex = -1;
let playbackList = []; // 現在の再生リストコンテキスト
let isShuffle = false;
let repeatMode = 'OFF'; // 'OFF' | 'ALL' | 'ONE'
let currentAudioUrl = null;

// Lyrics, Rates & Timers
let parsedLyrics = [];
let currentLyricIndex = -1;
const playbackRates = [1.0, 1.25, 1.5, 2.0, 0.5, 0.75];
let currentRateIdx = 0;
let sleepTimerTimeout = null;
let sleepTimerEndOnSong = false;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('songs')) {
        db.createObjectStore('songs', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('playlists')) {
        db.createObjectStore('playlists', { keyPath: 'id', autoIncrement: true });
      }
    };
    request.onsuccess = (e) => { db = e.target.result; resolve(); };
    request.onerror = (e) => reject(e);
  });
}

window.addEventListener('DOMContentLoaded', async () => {
  await initDB();
  await loadSongsFromDB();
  await loadPlaylistsFromDB();
  setupDragAndDrop();
  populatePlaylistDropdown();
  renderSongs();
});

/* ==========================================
3. DB Operations
========================================== */
async function loadSongsFromDB() {
  return new Promise((resolve) => {
    const tx = db.transaction('songs', 'readonly');
    const req = tx.objectStore('songs').getAll();
    req.onsuccess = () => {
      songsData = req.result || [];
      songsData.forEach(s => {
        if (!s.playCount) s.playCount = 0;
        if (s.isFavorite === undefined) s.isFavorite = false;
        if (!s.album) s.album = '不明なアルバム';
      });
      resolve();
    };
  });
}

async function loadPlaylistsFromDB() {
  return new Promise((resolve) => {
    const tx = db.transaction('playlists', 'readonly');
    const req = tx.objectStore('playlists').getAll();
    req.onsuccess = () => {
      playlistsData = req.result || [];
      resolve();
    };
  });
}

async function saveSongToDB(song) {
  return new Promise((resolve) => {
    const tx = db.transaction('songs', 'readwrite');
    const req = tx.objectStore('songs').put(song);
    req.onsuccess = () => { song.id = req.result; resolve(song); };
  });
}

async function deleteSongFromDB(id) {
  return new Promise((resolve) => {
    const tx = db.transaction('songs', 'readwrite');
    tx.objectStore('songs').delete(id).onsuccess = () => resolve();
  });
}

async function savePlaylistToDB(playlist) {
  return new Promise((resolve) => {
    const tx = db.transaction('playlists', 'readwrite');
    tx.objectStore('playlists').put(playlist).onsuccess = () => resolve();
  });
}

/* ==========================================
4. UI & Tab Rendering
========================================== */
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.nav-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });

  ['songs', 'artists', 'albums', 'smart', 'playlists'].forEach(t => {
    const el = document.getElementById(`${t}TabContent`);
    if (el) el.style.display = t === tab ? 'block' : 'none';
  });

  if (tab === 'artists') renderArtists();
  if (tab === 'albums') renderAlbums();
  if (tab === 'smart') renderSmartTab();
  if (tab === 'playlists') renderPlaylists();
}

function renderSongs() {
  const container = document.getElementById('songListContainer');
  const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  const sortBy = document.getElementById('sortSelect').value;

  let filtered = songsData.filter(s => {
    if (!searchQuery) return true;
    return (s.title || '').toLowerCase().includes(searchQuery) || 
           (s.artist || '').toLowerCase().includes(searchQuery);
  });

  if (sortBy === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title));
  else if (sortBy === 'artist') filtered.sort((a, b) => a.artist.localeCompare(b.artist));
  else if (sortBy === 'plays') filtered.sort((a, b) => b.playCount - a.playCount);
  else filtered.sort((a, b) => b.id - a.id);

  playbackList = filtered;
  container.innerHTML = '';

  if (filtered.length === 0) {
    container.innerHTML = `<li class="text-center text-muted py-5 small">楽曲が見つかりません</li>`;
    return;
  }

  filtered.forEach((song) => {
    const isPlaying = currentPlayingIndex !== -1 && playbackList[currentPlayingIndex]?.id === song.id;
    const li = document.createElement('li');
    li.className = `song-item ${isPlaying ? 'active' : ''}`;

    li.innerHTML = `
      ${isBatchMode ? `<input type="checkbox" class="song-checkbox" ${selectedSongIds.has(song.id) ? 'checked' : ''} onchange="toggleSelectSong(${song.id})">` : ''}
      <div class="song-cover" onclick="playSongById(${song.id})">
        ${song.coverUrl ? `<img src="${song.coverUrl}">` : `<i class="fa-solid ${isPlaying ? 'fa-volume-high text-danger' : 'fa-music text-secondary'}"></i>`}
      </div>
      <div class="song-details" onclick="${isBatchMode ? `toggleSelectSong(${song.id})` : `playSongById(${song.id})`}">
        <div class="song-title">${escapeHtml(song.title)}</div>
        <div class="song-artist">${escapeHtml(song.artist)} • ${escapeHtml(song.album)}</div>
        <div class="song-meta"><i class="fa-solid fa-play me-1"></i>${song.playCount}回再生 ${song.lrc ? '• LRC歌詞あり' : ''}</div>
      </div>
      <div class="song-actions">
        <button class="btn-action-icon ${song.isFavorite ? 'active' : ''}" onclick="toggleFavorite(${song.id})">
          <i class="fa-${song.isFavorite ? 'solid' : 'regular'} fa-heart"></i>
        </button>
        <button class="btn-action-icon" onclick="deleteSingleSong(${song.id})"><i class="fa-solid fa-trash"></i></button>
      </div>
    `;
    container.appendChild(li);
  });

  updateBatchToolbarUI();
}

function renderArtists() {
  const container = document.getElementById('artistsGrid');
  container.innerHTML = '';
  const groups = {};

  songsData.forEach(s => {
    const artist = s.artist || '不明なアーティスト';
    if (!groups[artist]) groups[artist] = [];
    groups[artist].push(s);
  });

  Object.keys(groups).forEach(artist => {
    const list = groups[artist];
    const cover = list.find(s => s.coverUrl)?.coverUrl;
    const card = document.createElement('div');
    card.className = 'grid-card';
    card.onclick = () => openGroupDetail(artist, list);
    card.innerHTML = `
      <div class="grid-cover">${cover ? `<img src="${cover}">` : '<i class="fa-solid fa-user text-secondary"></i>'}</div>
      <div class="grid-title">${escapeHtml(artist)}</div>
      <div class="grid-sub">${list.length}曲</div>
    `;
    container.appendChild(card);
  });
}

function renderAlbums() {
  const container = document.getElementById('albumsGrid');
  container.innerHTML = '';
  const groups = {};

  songsData.forEach(s => {
    const album = s.album || '不明なアルバム';
    if (!groups[album]) groups[album] = [];
    groups[album].push(s);
  });

  Object.keys(groups).forEach(album => {
    const list = groups[album];
    const cover = list.find(s => s.coverUrl)?.coverUrl;
    const card = document.createElement('div');
    card.className = 'grid-card';
    card.onclick = () => openGroupDetail(album, list);
    card.innerHTML = `
      <div class="grid-cover">${cover ? `<img src="${cover}">` : '<i class="fa-solid fa-compact-disc text-secondary"></i>'}</div>
      <div class="grid-title">${escapeHtml(album)}</div>
      <div class="grid-sub">${escapeHtml(list[0].artist)}</div>
    `;
    container.appendChild(card);
  });
}

function renderSmartTab() {
  const favs = songsData.filter(s => s.isFavorite);
  document.getElementById('favCountSub').innerText = `${favs.length}曲`;
}

function openSmartList(type) {
  let list = [];
  let title = '';
  if (type === 'fav') {
    title = 'お気に入り';
    list = songsData.filter(s => s.isFavorite);
  } else if (type === 'recent') {
    title = '最近追加した曲';
    list = [...songsData].sort((a, b) => b.id - a.id).slice(0, 30);
  } else if (type === 'top25') {
    title = 'よく聴く曲 Top 25';
    list = [...songsData].sort((a, b) => b.playCount - a.playCount).slice(0, 25);
  }
  openGroupDetail(title, list);
}

function openGroupDetail(title, list) {
  document.getElementById('playlistDetailTitle').innerText = title;
  const container = document.getElementById('playlistSongListContainer');
  container.innerHTML = '';

  list.forEach(song => {
    const li = document.createElement('li');
    li.className = 'song-item';
    li.innerHTML = `
      <div class="song-cover" onclick="playCustomListSong(${song.id}, ${JSON.stringify(list.map(s=>s.id))})">
        ${song.coverUrl ? `<img src="${song.coverUrl}">` : `<i class="fa-solid fa-music text-secondary"></i>`}
      </div>
      <div class="song-details" onclick="playCustomListSong(${song.id}, ${JSON.stringify(list.map(s=>s.id))})">
        <div class="song-title">${escapeHtml(song.title)}</div>

function renderPlaylists() {
  const container = document.getElementById('playlistGrid');
  container.innerHTML = '';

  playlistsData.forEach(p => {
    const card = document.createElement('div');
    card.className = 'grid-card';
    card.onclick = () => {
      const list = songsData.filter(s => p.songIds.includes(s.id));
      openGroupDetail(p.name, list);
    };

      <div class="grid-cover"><i class="fa-solid fa-list-ul"></i></div>

      <div class="grid-sub">${p.songIds.length}曲</div>
    `;
    container.appendChild(card);

/* ==========================================
5. Import & File Processing (Audio + LRC)
========================================== */
function setupDragAndDrop() {
  const zone = document.getElementById('dropZone');
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => zone.addEventListener(e, prev => prev.preventDefault()));
  zone.addEventListener('drop', (e) => {
    if (e.dataTransfer && e.dataTransfer.files.length > 0) handleFileImport(e.dataTransfer.files);
  });
}

async function handleFileImport(files) {
  const audioFiles = [];
  const lrcMap = {};

  for (let file of files) {
    if (file.name.endsWith('.lrc')) {
      const text = await file.text();
      const baseName = file.name.replace(/\.lrc$/i, '');
      lrcMap[baseName] = text;
    } else {
      audioFiles.push(file);
    }
  }

  for (let file of audioFiles) {
    const meta = await parseAudioMetadata(file);
    const baseName = file.name.replace(/\.[^/.]+$/, "");
    
    const newSong = {
      title: meta.title,
      artist: meta.artist,
      album: meta.album || '不明なアルバム',
      coverUrl: meta.coverUrl,
      audioBlob: file,
      lrc: lrcMap[baseName] || null,
      playCount: 0,
      isFavorite: false,
      addedAt: Date.now()
    };

    const saved = await saveSongToDB(newSong);
    songsData.unshift(saved);
  }

  renderSongs();
  document.getElementById('fileInput').value = '';
}

function parseAudioMetadata(file) {
  return new Promise((resolve) => {
    const defaultTitle = file.name.replace(/\.[^/.]+$/, "");
    const fallback = { title: defaultTitle, artist: '不明なアーティスト', album: '不明なアルバム', coverUrl: null };

    if (!window.jsmediatags) { resolve(fallback); return; }

    window.jsmediatags.read(file, {
      onSuccess: function(tag) {
        const t = tag.tags;
        let coverUrl = null;
        if (t.picture) {
          const { data, format } = t.picture;
          let base64 = "";
          for (let i = 0; i < data.length; i++) base64 += String.fromCharCode(data[i]);
          coverUrl = `data:${format};base64,${window.btoa(base64)}`;
        }
        resolve({
          title: t.title ? t.title.trim() : defaultTitle,
          artist: t.artist ? t.artist.trim() : '不明なアーティスト',
          album: t.album ? t.album.trim() : '不明なアルバム',
          coverUrl
        });
      },
      onError: () => resolve(fallback)
    });
  });
}

/* ==========================================
6. Favorites & Playback Core
========================================== */
async function toggleFavorite(id) {
  const song = songsData.find(s => s.id === id);
  if (song) {
    song.isFavorite = !song.isFavorite;
    await saveSongToDB(song);
    renderSongs();
    updatePlayerUI();
  }
}

function toggleFavoriteCurrent(e) {
  e.stopPropagation();
  if (currentPlayingIndex !== -1 && playbackList[currentPlayingIndex]) {
    toggleFavorite(playbackList[currentPlayingIndex].id);
  }
}

function playSongById(id) {
  const idx = playbackList.findIndex(s => s.id === id);
  if (idx !== -1) playSongAtIndex(idx);
}

function playCustomListSong(id, idArray) {
  playbackList = songsData.filter(s => idArray.includes(s.id));
  const idx = playbackList.findIndex(s => s.id === id);
  if (idx !== -1) playSongAtIndex(idx);
}

function playSongAtIndex(index) {
  if (index < 0 || index >= playbackList.length) return;

  currentPlayingIndex = index;
  const song = playbackList[currentPlayingIndex];

  // Playcount Increment
  song.playCount = (song.playCount || 0) + 1;
  saveSongToDB(song);

  const audio = document.getElementById('audioPlayer');
  if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);

  if (song.audioBlob) {
    currentAudioUrl = URL.createObjectURL(song.audioBlob);
    audio.src = currentAudioUrl;
    audio.playbackRate = playbackRates[currentRateIdx];
    audio.play().catch(e => console.error(e));
  }

  parseLyrics(song.lrc);
  extractAmbientColor(song.coverUrl);
  updatePlayerUI();
  renderSongs();
}

function togglePlay() {
  const audio = document.getElementById('audioPlayer');
  if (currentPlayingIndex === -1) {
    if (playbackList.length > 0) playSongAtIndex(0);
    return;
  }
  if (audio.paused) audio.play();
  else audio.pause();
  updatePlayerUI();
}

function playNext() {
  if (playbackList.length === 0) return;
  if (isShuffle) {
    playSongAtIndex(Math.floor(Math.random() * playbackList.length));
  } else {
    let next = currentPlayingIndex + 1;
    if (next >= playbackList.length) {
      if (repeatMode === 'ALL') next = 0;
      else return;
    }
    playSongAtIndex(next);
  }
}

function playPrev() {
  if (playbackList.length === 0) return;
  let prev = currentPlayingIndex - 1;
  if (prev < 0) prev = playbackList.length - 1;
  playSongAtIndex(prev);
}

function handleSongEnd() {
  if (sleepTimerEndOnSong) {
    stopAudio();
    sleepTimerEndOnSong = false;
    alert('スリープタイマーにより再生を停止しました。');
    return;
  }
  if (repeatMode === 'ONE') playSongAtIndex(currentPlayingIndex);
  else playNext();
}

function stopAudio() {
  const audio = document.getElementById('audioPlayer');
  audio.pause();
  updatePlayerUI();
}

/* ==========================================
7. Dynamic Ambient Color Extraction
========================================== */
function extractAmbientColor(coverUrl) {
  const modal = document.getElementById('fullPlayerModal');
  if (!coverUrl) {
    modal.style.setProperty('--ambient-color-1', '#2c2c2e');
    modal.style.setProperty('--ambient-color-2', '#0a0a0c');
    return;
  }

  const img = new Image();
  img.crossOrigin = 'Anonymous';
  img.src = coverUrl;
  img.onload = () => {
    const canvas = document.getElementById('colorCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 50; canvas.height = 50;
    ctx.drawImage(img, 0, 0, 50, 50);
    const data = ctx.getImageData(0, 0, 50, 50).data;

    let r = 0, g = 0, b = 0;
    for (let i = 0; i < data.length; i += 16) {
      r += data[i]; g += data[i+1]; b += data[i+2];
    }
    const count = data.length / 16;
    r = Math.floor(r / count); g = Math.floor(g / count); b = Math.floor(b / count);

    modal.style.setProperty('--ambient-color-1', `rgb(${r}, ${g}, ${b})`);
    modal.style.setProperty('--ambient-color-2', `rgb(${Math.floor(r*0.2)}, ${Math.floor(g*0.2)}, ${Math.floor(b*0.2)})`);
  };
}

/* ==========================================
8. LRC Lyrics Engine
========================================== */
function parseLyrics(lrcText) {
  parsedLyrics = [];
  currentLyricIndex = -1;
  const container = document.getElementById('lyricsContainer');
  container.innerHTML = '';

  if (!lrcText) {
    container.innerHTML = '<div class="lyric-line active">歌詞がありません</div>';
    return;
  }

  const lines = lrcText.split('\n');
  const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

  lines.forEach(line => {
    const match = timeReg.exec(line);
    if (match) {
      const min = parseInt(match[1]);
      const sec = parseInt(match[2]);
      const ms = parseInt(match[3].padEnd(3, '0'));
      const time = min * 60 + sec + ms / 1000;
      const text = line.replace(timeReg, '').trim();
      if (text) parsedLyrics.push({ time, text });
    }
  });

  parsedLyrics.sort((a, b) => a.time - b.time);

  parsedLyrics.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'lyric-line';
    div.id = `lyric-${idx}`;
    div.innerText = item.text;
    div.onclick = () => {
      document.getElementById('audioPlayer').currentTime = item.time;
    };
    container.appendChild(div);
  });
}

function updateLyrics(currentTime) {
  if (parsedLyrics.length === 0) return;

  let activeIdx = -1;
  for (let i = 0; i < parsedLyrics.length; i++) {
    if (currentTime >= parsedLyrics[i].time) activeIdx = i;
    else break;
  }

  if (activeIdx !== currentLyricIndex && activeIdx !== -1) {
    if (currentLyricIndex !== -1) {
      const prevEl = document.getElementById(`lyric-${currentLyricIndex}`);
      if (prevEl) prevEl.classList.remove('active');
    }
    const currEl = document.getElementById(`lyric-${activeIdx}`);
    if (currEl) {
      currEl.classList.add('active');
      currEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    currentLyricIndex = activeIdx;
  }
}

function toggleLyrics() {
  const lyricsEl = document.getElementById('lyricsContainer');
  const btn = document.getElementById('lyricsToggleBtn');
  lyricsEl.classList.toggle('active');
  btn.classList.toggle('active', lyricsEl.classList.contains('active'));
}

/* ==========================================
9. Playback Rate & Sleep Timer
========================================== */
function cyclePlaybackRate() {
  currentRateIdx = (currentRateIdx + 1) % playbackRates.length;
  const rate = playbackRates[currentRateIdx];
  const audio = document.getElementById('audioPlayer');
  audio.playbackRate = rate;
  document.getElementById('speedBtn').innerText = `${rate}x`;
}

function openSleepTimerMenu() {
  const option = prompt("スリープタイマーを設定 (分):\n15, 30, 60 または 'end' (曲終わり)", "30");
  if (!option) return;

  if (sleepTimerTimeout) clearTimeout(sleepTimerTimeout);
  sleepTimerEndOnSong = false;

  if (option.toLowerCase() === 'end') {
    sleepTimerEndOnSong = true;
    alert("現在の曲の終わりで停止します。");
  } else {
    const mins = parseInt(option);
    if (!isNaN(mins) && mins > 0) {
      sleepTimerTimeout = setTimeout(() => {
        stopAudio();
        alert(`${mins}分経過したため停止しました。`);
      }, mins * 60 * 1000);
      alert(`${mins}分後に自動停止します。`);
    }
  }
}

/* ==========================================
10. UI Helpers & Modals
========================================== */
function updateProgress() {
  const audio = document.getElementById('audioPlayer');
  if (!audio.duration) return;

  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById('miniProgressBar').style.width = `${pct}%`;
  document.getElementById('fullSeekSlider').value = pct;

  document.getElementById('currentTimeText').innerText = formatTime(audio.currentTime);
  document.getElementById('durationTimeText').innerText = formatTime(audio.duration);

  updateLyrics(audio.currentTime);
}

function updatePlayerUI() {
  const audio = document.getElementById('audioPlayer');
  const isPaused = audio.paused;
  const song = playbackList[currentPlayingIndex];

  if (song) {
    document.getElementById('playerMiniTitle').innerText = song.title;
    document.getElementById('playerMiniArtist').innerText = song.artist;
    document.getElementById('fullPlayerTitle').innerText = song.title;
    document.getElementById('fullPlayerArtist').innerText = song.artist;

    const coverHTML = song.coverUrl ? `<img src="${song.coverUrl}">` : `<i class="fa-solid fa-music text-secondary"></i>`;
    document.getElementById('playerMiniCover').innerHTML = coverHTML;
    document.getElementById('fullPlayerCover').innerHTML = song.coverUrl ? `<img src="${song.coverUrl}">` : `<i class="fa-solid fa-music text-secondary" style="font-size: 80px;"></i>`;

    const favIcon = `<i class="fa-${song.isFavorite ? 'solid' : 'regular'} fa-heart"></i>`;
    document.getElementById('miniFavBtn').innerHTML = favIcon;
    document.getElementById('fullFavBtn').innerHTML = favIcon;
    document.getElementById('miniFavBtn').classList.toggle('active', song.isFavorite);
    document.getElementById('fullFavBtn').classList.toggle('active', song.isFavorite);
  }

  document.getElementById('miniPlayBtnIcon').className = isPaused ? 'fa-solid fa-play' : 'fa-solid fa-pause';
  document.getElementById('fullPlayBtnIcon').className = isPaused ? 'fa-solid fa-circle-play' : 'fa-solid fa-circle-pause';
}

function seekMiniPlayer(e) {
  const audio = document.getElementById('audioPlayer');
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

function onSeekSliderChange(val) {
  const audio = document.getElementById('audioPlayer');
  if (!audio.duration) return;
  audio.currentTime = (val / 100) * audio.duration;
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('fullShuffleBtn').classList.toggle('active', isShuffle);
}

function toggleRepeat() {
  if (repeatMode === 'OFF') repeatMode = 'ALL';
  else if (repeatMode === 'ALL') repeatMode = 'ONE';
  else repeatMode = 'OFF';
  document.getElementById('fullRepeatBtn').classList.toggle('active', repeatMode !== 'OFF');
}

function toggleBatchMode() {
  isBatchMode = !isBatchMode;
  if (!isBatchMode) selectedSongIds.clear();
  renderSongs();
}

function toggleSelectSong(id) {
  if (selectedSongIds.has(id)) selectedSongIds.delete(id);
  else selectedSongIds.add(id);
  renderSongs();
}

function toggleSelectAll(checked) {
  if (checked) songsData.forEach(s => selectedSongIds.add(s.id));
  else selectedSongIds.clear();
  renderSongs();
}

function updateBatchToolbarUI() {
  document.getElementById('batchToolbar').classList.toggle('active', isBatchMode);
  document.getElementById('selectedCountText').innerText = `${selectedSongIds.size}件選択中`;
}

function populatePlaylistDropdown() {
  const select = document.getElementById('batchPlaylistSelect');
  select.innerHTML = '<option value="">追加先...</option>';
  playlistsData.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    select.appendChild(opt);
  });
}

async function executeBatchAddToPlaylist() {
  const playlistId = Number(document.getElementById('batchPlaylistSelect').value);
  if (!playlistId || selectedSongIds.size === 0) return;
  const playlist = playlistsData.find(p => p.id === playlistId);
  if (playlist) {
    playlist.songIds = Array.from(new Set([...playlist.songIds, ...Array.from(selectedSongIds)]));
    await savePlaylistToDB(playlist);
    alert('追加しました');
    toggleBatchMode();
  }
}

async function executeBatchDelete() {
  if (selectedSongIds.size === 0 || !confirm('選択した曲を削除しますか？')) return;
  for (let id of selectedSongIds) await deleteSongFromDB(id);
  songsData = songsData.filter(s => !selectedSongIds.has(s.id));
  toggleBatchMode();
}

async function deleteSingleSong(id) {
  if (!confirm('この楽曲を削除しますか？')) return;
  await deleteSongFromDB(id);
  songsData = songsData.filter(s => s.id !== id);
  renderSongs();
}

function openFullPlayer() { document.getElementById('fullPlayerModal').classList.add('active'); }
function closeFullPlayer() { document.getElementById('fullPlayerModal').classList.remove('active'); }
function openCreatePlaylistModal() { new bootstrap.Modal(document.getElementById('createPlaylistModal')).show(); }

async function saveNewPlaylist() {
  const input = document.getElementById('newPlaylistNameInput');
  if (!input.value.trim()) return;
  const newPl = { name: input.value.trim(), songIds: [] };
  await savePlaylistToDB(newPl);
  await loadPlaylistsFromDB();
  populatePlaylistDropdown();
  renderPlaylists();
  input.value = '';
  bootstrap.Modal.getInstance(document.getElementById('createPlaylistModal')).hide();
}

function openCurrentPlaylistModal() {
  const container = document.getElementById('currentPlaylistItems');
  container.innerHTML = '';
  playbackList.forEach((song, idx) => {
    const li = document.createElement('div');
    li.className = `song-item ${currentPlayingIndex === idx ? 'active' : ''}`;
    li.onclick = () => { playSongAtIndex(idx); closeCurrentPlaylistModal(); };
    li.innerHTML = `
      <div class="song-title">${escapeHtml(song.title)}</div>
      <div class="song-artist">${escapeHtml(song.artist)}</div>
    `;
    container.appendChild(li);
  });
  document.getElementById('currentPlaylistModal').style.display = 'flex';
}
function closeCurrentPlaylistModal() { document.getElementById('currentPlaylistModal').style.display = 'none'; }
function openSettingsModal() { new bootstrap.Modal(document.getElementById('settingsModal')).show(); }

async function clearAllData() {
  if (!confirm('全データを削除しますか？')) return;
  const tx1 = db.transaction('songs', 'readwrite'); tx1.objectStore('songs').clear();
  const tx2 = db.transaction('playlists', 'readwrite'); tx2.objectStore('playlists').clear();
  songsData = []; playlistsData = [];
  renderSongs();
  bootstrap.Modal.getInstance(document.getElementById('settingsModal')).hide();
}

function formatTime(sec) {
  if (isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
</body>
