<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Music Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 10px 0;
    }
    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #b3b3b3;
    }
    .file-select-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #1ed760;
      color: #000;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    input[type="file"] {
      display: none;
    }
    .player-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }
    .album-art {
      width: 220px;
      height: 220px;
      background: linear-gradient(135deg, #333, #1e1e1e);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      margin-bottom: 25px;
    }
    .album-art svg {
      width: 80px;
      height: 80px;
      fill: #535353;
    }
    .track-info {
      text-align: center;
      width: 100%;
      padding: 0 10px;
    }
    .track-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-status {
      font-size: 0.85rem;
      color: #b3b3b3;
    }
    .controls-container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .time-text {
      font-size: 0.75rem;
      color: #b3b3b3;
      width: 35px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background-color: #535353;
      border-radius: 2px;
      appearance: none;
      outline: none;
    }
    .progress-bar::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ffffff;
      cursor: pointer;
    }
    .buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .btn {
      background: none;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-play {
      width: 60px;
      height: 60px;
      background-color: #ffffff;
      border-radius: 50%;
      color: #000000;
    }
    .playlist-section {
      max-height: 180px;
      overflow-y: auto;
      border-top: 1px solid #282828;
      padding-top: 10px;
    }
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .playlist-title {
      font-size: 0.9rem;
      color: #b3b3b3;
    }
    .clear-btn {
      font-size: 0.75rem;
      color: #eb4d4b;
      background: none;
      border: none;
      cursor: pointer;
    }
    .playlist-item {
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .playlist-item.active {
      background-color: #282828;
      color: #1ed760;
    }
    .playlist-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
  </style>
</head>
<body>

  <header>
    <h1>マイ プレイリスト</h1>
    <label class="file-select-btn">
      曲を追加する
      <input type="file" id="audioInput" accept="audio/*, .mp3, .m4a, .wav" multiple>
    </label>
  </header>

  <div class="player-display">
    <div class="album-art">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <div class="track-info">
      <div class="track-title" id="trackTitle">曲が選択されていません</div>
      <div class="track-status" id="trackStatus">ライブラリから追加してください</div>
    </div>
  </div>

  <div class="controls-container">
    <div class="progress-container">
      <span class="time-text" id="currentTime">0:00</span>
      <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
      <span class="time-text" id="duration">0:00</span>
    </div>

    <div class="buttons">
      <button class="btn" id="prevBtn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="btn btn-play" id="playBtn">
        <svg id="playIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn" id="nextBtn">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="playlist-section">
      <div class="playlist-header">
        <span class="playlist-title">保存された曲</span>
        <button class="clear-btn" id="clearBtn">全削除</button>
      </div>
      <div id="playlistItems"></div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const dbName = "MusicPlayerDB";
    const storeName = "tracks";
    let db;

    const audioPlayer = document.getElementById('audioPlayer');
    const audioInput = document.getElementById('audioInput');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackStatus = document.getElementById('trackStatus');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const progressBar = document.getElementById('progressBar');
    const playlistItems = document.getElementById('playlistItems');
    const clearBtn = document.getElementById('clearBtn');

    let playlist = [];
    let currentIndex = -1;

    // IndexedDB の初期化
    const request = indexedDB.open(dbName, 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains(storeName)) {
        db.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      loadPlaylistFromDB();
    };

    // DB から曲一覧を取得して読み込み
    function loadPlaylistFromDB() {
      const tx = db.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      const req = store.getAll();
      req.onsuccess = () => {
        playlist = req.result;
        renderPlaylist();
        if (playlist.length > 0 && currentIndex === -1) {
          selectTrack(0, false);
        }
      };
    }

    // ファイル追加イベント
    audioInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);

      files.forEach(file => {
        const item = {
          name: file.name.replace(/\.[^/.]+$/, ""),
          blob: file
        };
        store.add(item);
      });

      tx.oncomplete = () => {
        loadPlaylistFromDB();
      };
    });

    // プレイリスト描画
    function renderPlaylist() {
      playlistItems.innerHTML = '';
      playlist.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
        item.innerHTML = `<div class="playlist-item-title">${track.name}</div>`;
        item.addEventListener('click', () => selectTrack(index, true));
        playlistItems.appendChild(item);
      });
    }

    // 曲選択
    function selectTrack(index, autoPlay = true) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;

      const track = playlist[currentIndex];
      const objectUrl = URL.createObjectURL(track.blob);
      audioPlayer.src = objectUrl;
      trackTitle.textContent = track.name;
      trackStatus.textContent = `曲 ${index + 1} / ${playlist.length}`;

      renderPlaylist();

      if (autoPlay) {
        audioPlayer.play();
        updatePlayIcon(true);
      }
    }

    // 再生・停止切り替え
    playBtn.addEventListener('click', () => {
      if (playlist.length === 0) return;
      if (audioPlayer.paused) {
        audioPlayer.play();
        updatePlayIcon(true);
      } else {
        audioPlayer.pause();
        updatePlayIcon(false);
      }
    });

    function updatePlayIcon(isPlaying) {
      if (isPlaying) {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) selectTrack(currentIndex - 1, true);
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < playlist.length - 1) selectTrack(currentIndex + 1, true);
    });

    audioPlayer.addEventListener('ended', () => {
      if (currentIndex < playlist.length - 1) {
        selectTrack(currentIndex + 1, true);
      } else {
        updatePlayIcon(false);
      }
    });

    // 進捗バー制御
    audioPlayer.addEventListener('timeupdate', () => {
      if (isNaN(audioPlayer.duration)) return;
      progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
      currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
      durationEl.textContent = formatTime(audioPlayer.duration);
    });

    progressBar.addEventListener('input', () => {
      if (isNaN(audioPlayer.duration)) return;
      audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // 全削除
    clearBtn.addEventListener('click', () => {
      if (!confirm("保存された曲をすべて削除しますか？")) return;
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);
      store.clear();
      tx.oncomplete = () => {
        playlist = [];
        currentIndex = -1;
        audioPlayer.src = '';
        trackTitle.textContent = "曲が選択されていません";
        trackStatus.textContent = "ライブラリから追加してください";
        currentTimeEl.textContent = "0:00";
        durationEl.textContent = "0:00";
        progressBar.value = 0;
        updatePlayIcon(false);
        renderPlaylist();
      };
    });
  </script>
</body>
</html>
